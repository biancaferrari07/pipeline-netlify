
name: Deploy manual - Main

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código da branch main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Instalar Netlify CLI
        run: npm install -g netlify-cli

      - name: Publicar no Netlify (main)
        run: netlify deploy --site="${{ secrets.NETLIFY_SITE_ID }}" --auth="${{ secrets.NETLIFY_AUTH_TOKEN }}" --dir="." --prod
